name: Build ComQuiz APK
on:
  workflow_dispatch:
    inputs:
      author_name:
        description: Author name
        required: true
        default: Kan
      student_id:
        description: Student ID
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build release APK
        env:
          CQ_AUTHOR: ${{ inputs.author_name }}
          CQ_STUDENT_ID: ${{ inputs.student_id }}
        run: flutter build apk --release --dart-define="AUTHOR_NAME=$CQ_AUTHOR" --dart-define="STUDENT_ID=$CQ_STUDENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: ComQuiz-APK
          path: build/app/outputs/flutter-apk/app-release.apk
