name: comquiz
description: เกมตอบคำถามความรู้คอมพิวเตอร์สำหรับโปรเจกต์ท้ายเทอม
publish_to: none
version: 1.1.0+2
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.5.3
  cupertino_icons: 1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700
